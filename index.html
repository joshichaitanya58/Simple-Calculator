<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/564/564429.png" type="image/png">
</head>

<body>
    <div class="container">
        <div class="calculator">
            <div class="calc-header">
                <h1><i>Calculator</i></h1>
                <div class="more-btn">
                    <button id="more" type="button" title="Toggle Scientific Operations">More</button>
                </div>
            </div>

            <div class="display">
                <p id="result"></p>
            </div>

            <div class="keys basic-grid">
                <button id="sin" class="hidden sci-btn">sin</button>
                <button id="cos" class="hidden sci-btn">cos</button>
                <button id="tan" class="hidden sci-btn">tan</button>
                <button id="rad" class="hidden sci-btn">rad</button>
                <button id="deg" class="hidden sci-btn" style="color: rgb(232, 103, 44);">deg</button> <br>

                <button id="log" class="hidden sci-btn">log</button>
                <button id="ln" class="hidden sci-btn">ln</button>
                <button id="openbracket" class="hidden sci-btn">(</button>
                <button id="closebracket" class="hidden sci-btn">)</button>
                <button id="inverse" class="hidden sci-btn">inv</button> <br>

                <button id="factorial" class="hidden sci-btn">!</button>
                <button id="clear" class="action-btn">Ac</button>
                <button id="percent" class="action-btn">%</button>
                <button id="del" class="action-btn">⌫</button>
                <button id="divide" class="op-btn">/</button> <br>

                <button id="power" class="hidden sci-btn">^</button>
                <button id="7" class="num-btn">7</button>
                <button id="8" class="num-btn">8</button>
                <button id="9" class="num-btn">9</button>
                <button id="multiply" class="op-btn">*</button> <br>

                <button id="square" class="hidden sci-btn">√</button>
                <button id="4" class="num-btn">4</button>
                <button id="5" class="num-btn">5</button>
                <button id="6" class="num-btn">6</button>
                <button id="subtract" class="op-btn">-</button> <br>

                <button id="pi" class="hidden sci-btn">π</button>
                <button id="1" class="num-btn">1</button>
                <button id="2" class="num-btn">2</button>
                <button id="3" class="num-btn">3</button>
                <button id="add" class="op-btn">+</button> <br>

                <button id="e" class="hidden sci-btn">e</button>
                <button id="doublezero" class="num-btn">00</button>
                <button id="zero" class="num-btn">0</button>
                <button id="point" class="num-btn">.</button>
                <button id="equal" class="equal-btn">=</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
