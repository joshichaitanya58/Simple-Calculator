<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="calculator">
            <h1> <i> Calculator </i> </h1>
            <div class="display">
                <p id="result">  </p>
            </div>
            <div class="keys">
                <button id="sin" class="hidden">sin</button>
                <button id="cos" class="hidden">cos</button>
                <button id="tan" class="hidden">tan</button>
                <button id="rad" class="hidden">rad</button>
                <button id="deg" class="hidden" style="color: rgb(232, 103, 44);">deg</button> <br>
                <button id="log" class="hidden">log</button>
                <button id="ln" class="hidden">ln</button>
                <button id="openbracket" class="hidden">(</button>
                <button id="closebracket" class="hidden">)</button>
                <button id="inverse" class="hidden">inv</button> <br>
                <button id="factorial" class="hidden">!</button>
                <button id="clear" style="background-color: rgb(37, 36, 36);">Ac</button>
                <button id="percent" style="background-color: rgb(37, 36, 36);">%</button>
                <button id="del" style="background-color: rgb(37, 36, 36);">x</button>
                <button id="divide" style="background-color: rgb(37, 36, 36);">/</button> <br>
                <button id="power" class="hidden">^</button>
                <button id="7">7</button>
                <button id="8">8</button>
                <button id="9">9</button>
                <button id="multiply" style="background-color: rgb(37, 36, 36);">*</button> <br>
                <button id="square" class="hidden">√</button>
                <button id="4">4</button>
                <button id="5">5</button>
                <button id="6">6</button>
                <button id="subtract" style="background-color: rgb(37, 36, 36);">-</button> <br>
                <button id="pi" class="hidden">π</button>
                <button id="1">1</button>
                <button id="2">2</button>
                <button id="3">3</button>
                <button id="add" style="background-color: rgb(37, 36, 36);">+</button> <br>
                <button id="e" class="hidden">e</button>
                <button id="doublezero">00</button>
                <button id="zero">0</button>
                <button id="point">.</button>
                <button id="equal" style="background-color: rgb(232, 103, 44);">=</button>
            </div>
        </div>

        <div class="more-btn">
            <button id="more">More</button>
        </div>

    </div>
    <script src="main.js"></script>
</body>

</html>
